[project]
name = "ising-gpu"
version = "2.0.0"
description = "GPU-accelerated Monte Carlo simulation of the Ising model, validated against exact solutions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Francisco Manuel Olmedo Cortés" }]
keywords = ["ising-model", "monte-carlo", "computational-physics", "gpu", "cupy", "metropolis"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
# CuPy wheels are CUDA-version specific, so it is deliberately not a hard
# dependency: the NumPy backend must stay installable anywhere.
cuda12 = ["cupy-cuda12x>=13.0"]
cuda11 = ["cupy-cuda11x>=13.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ising"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
